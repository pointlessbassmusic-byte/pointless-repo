# Kalshi predictions engine configuration

live: false             # master switch; must ALSO pass --live on the CLI to trade
use_demo: true          # target demo-api.kalshi.co (paper exchange) until proven
read_prod: true         # public market reads from prod (demo data is synthetic); orders still demo
scan_interval_sec: 900

markets:
  statuses: [open]
  # Only scan these series prefixes; empty list = scan everything open
  series_whitelist: []       # e.g. [KXHIGHNY, KXBTC, KXNBA]; empty = discover via /events
  # /events discovery (used when whitelist is empty); high cap = full feed
  max_events_per_scan: 20000
  categories: []             # e.g. [Sports, Crypto, Economics]; empty = all
  # ticker prefixes to skip (auto-generated multivariate shard markets)
  series_blacklist: [KXMVE]
  max_markets_per_scan: 1500  # keep the most liquid after filters
  min_volume: 100            # contracts traded; skip dead markets
  max_days_to_expiry: 30

substrate:
  generators:                # which signal generators are active
    market_implied:
      enabled: true
      confidence: 0.5
    mean_reversion:
      enabled: true
      confidence: 0.3
      lookback_scans: 8      # compare vs. price N scans ago
      overreaction_threshold: 0.10
      reversion_factor: 0.5
    time_decay:
      enabled: true
      confidence: 0.2
      horizon_hours: 48      # only near expiry
      drift_strength: 0.15

strategy:
  min_edge: 0.05
  kelly_fraction: 0.25
  bankroll_usd: 500
  max_stake_per_market: 40
  max_total_exposure: 200
  min_price: 0.05
  max_price: 0.95
  max_spread: 0.10           # skip books wider than this (illiquid/stale mid)

storage:
  db_path: data/engine.db

risk:
  max_daily_loss_usd: 50      # realized-loss circuit breaker: block new live orders for the day
  kill_switch_file: data/KILL_SWITCH  # `touch` this file to halt live trading immediately
