# The pre-registered live maker fill-share test (docs/MAKER_TEST.md), as a
# COMPLETE standalone config: `sportsbot run -c config/maker_test.yaml`.
#
# Shipped INERT: mode is paper. It places real orders only when the operator
# (1) sets `mode: live` here, (2) exports SPORTSBOT_LIVE=1, (3) supplies
# Kalshi keys in .env, and (4) gives the touch arms a learning budget in
# config/allocation.yaml (live money reaches an arm only through a manual
# weight, a green gate, or `learn: true` + learning.budget_usd -- this file
# cannot do that). Every knob is scaled to a $100 account; the test's only
# arm is the touch maker at $1 a side, so model/sharp arms are unfunded and
# tennis/table tennis are off. Secrets NEVER go here.

mode: paper            # paper | live  (live also requires SPORTSBOT_LIVE=1 in the environment)
exchange: kalshi       # US-legal venue; KALSHI_ENV=demo in .env routes orders to the demo exchange first

accounts:
  sim:
    starting_balance: 100.0
  real:
    starting_balance: 0.0    # set to what you have ACTUALLY funded on Kalshi before flipping mode

bankroll:
  amount: 100.0             # working bankroll; the per-sport cap below is 20% = $20
  kelly_multiplier: 0.25
  min_edge: 0.03            # model/sharp arms: unchanged bar (they are unfunded here anyway)
  min_stake: 1.0            # the touch arm's $1 must be placeable
  max_stake_per_market: 4.0 # matches touch.max_stake_per_market
  max_fraction_per_market: 0.04
  max_fraction_per_sport: 0.20
  max_total_exposure: 0.50
  max_open_positions: 30    # 200 fills over 30 days means many small open lines

blend:
  model_weight: 0.30

execution:
  max_spread: 0.03
  slippage_buffer: 0.005
  order_ttl_seconds: 120    # the measured 120 s deadline (Result 15): fill share is read at this TTL
  post_inside_spread: true
  max_depth_fraction: 0.25
  min_entry_price: 0.15
  max_entry_price: 0.85

touch:                           # THE test: bot/touch.py, Result 15 and its NHL/NFL addendum
  enabled: true
  sports: [baseball, hockey, football]
  improve: false                 # join the touch (what was measured)
  min_spread_ticks: 1
  max_spread: 0.10
  sides: both                    # one side per cycle, never self-crossing
  stake_usd: 1.0                 # minimum size by design
  max_stake_per_market: 4.0
  min_minutes_to_start: 10
  max_hours_to_start: 8

positions:
  manage: true
  exit_edge: -0.05
  stop_fraction: 0.5
  min_hold_minutes: 30

adaptive:
  enabled: true
  drawdown_stake_scaling: true
  stake_floor: 0.25
  clv_window: 50
  clv_min_bets: 30
  tighten_edge: 0.02
  stake_cut: 0.5

allocation:
  path: config/allocation.yaml   # the operator's file; see the header for the two lines the test needs

risk:                            # scaled to $100; the fraction form is the tighter one and wins
  daily_loss_limit: 10.0
  daily_loss_fraction: 0.10
  max_daily_new_risk: 0.25
  max_drawdown: 25.0
  max_drawdown_fraction: 0.25
  stale_quote_seconds: 120
  min_minutes_before_start: 10
  max_pre_match_move: 0.08
  calibration_min_bets: 50
  calibration_max_brier: 0.26

sharp:                           # ODDS_API_KEY: the sharp close for CLV grading, and the START TIME
  enabled: true                  # for Kalshi NHL/NFL tickers (they carry none; the risk layer refuses
  bookmakers: [pinnacle]         # entries without one). Without the key only MLB can post on Kalshi.
  sharp_book: pinnacle
  snapshot_interval_minutes: 15
  min_lead_minutes: 10
  credits_reserve: 50
  match_threshold: 0.85
  time_slack_hours: 6
  enforce_adaptive: true

scan:
  interval_seconds: 120          # a resting order lives one TTL; re-post on the next cycle
  sports: [baseball, hockey, football]

sports:
  tennis:
    enabled: false               # Result 9 + 15: no model edge, no touch edge
  table_tennis:
    enabled: false
  baseball:
    enabled: true
    signal: model                # ratings from the committed seed where the Stats API refuses the host
    home_advantage_elo: 24.0
    rest_advantage_elo: 2.3
    sp_enabled: true
    prob_shrink: 0.8
  basketball:
    enabled: false               # NBA: not measurable yet (11 pre-season markets); December re-measure
  football:
    enabled: true
    signal: sharp                # no rating model; the touch arm needs none
  hockey:
    enabled: true
    signal: sharp

storage:
  sqlite_path: data/sportsbot.sqlite   # same store as the sim: the board shows sim and real side by side
  ratings_dir: data/ratings

logging:
  level: INFO
  file: logs/sportsbot.log
