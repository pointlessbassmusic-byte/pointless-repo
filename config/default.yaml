# sportsbot default configuration.
# Copy to config/local.yaml for machine-specific overrides (gitignored).
# Secrets NEVER go here — they come from environment variables (.env).

mode: paper            # paper | live  (live also requires SPORTSBOT_LIVE=1 env var)
exchange: polymarket   # polymarket | kalshi | paper

accounts:                  # dashboard books (`sportsbot board`)
  sim:
    starting_balance: 100.0  # the paper stake the dashboard tracks
  real:
    starting_balance: 0.0    # set this to what you have ACTUALLY funded

bankroll:
  amount: 1000.0            # working bankroll in USDC/USD
  kelly_multiplier: 0.25    # quarter Kelly
  min_edge: 0.03            # minimum absolute edge after fees+slippage
  min_stake: 5.0
  max_stake_per_market: 50.0
  max_fraction_per_market: 0.05
  max_fraction_per_sport: 0.20
  max_total_exposure: 0.50
  max_open_positions: 20

blend:
  model_weight: 0.30        # prob = w*model + (1-w)*market mid; market is the prior

execution:
  max_spread: 0.03          # skip books wider than this (or quote passively)
  slippage_buffer: 0.005    # subtracted from edge before thresholding
  order_ttl_seconds: 120    # cancel unfilled resting orders after this
  post_inside_spread: true  # improve best bid rather than crossing
  max_depth_fraction: 0.25  # take at most this share of visible book depth
  min_entry_price: 0.15     # skip markets with mid outside this band
  max_entry_price: 0.85

positions:                       # open-position management (edge-driven, never loss-chasing)
  manage: true
  exit_edge: -0.05               # close when hold-EV sits this far below the exit value
  stop_fraction: 0.5             # hard stop: close when sellable value < 50% of cost basis
  min_hold_minutes: 30           # no churn right after entry

adaptive:                        # profit optimization: tighten-only, anti-martingale
  enabled: true
  drawdown_stake_scaling: true   # Kelly multiplier shrinks toward the floor as drawdown grows
  stake_floor: 0.25              # never below 25% of the configured multiplier
  clv_window: 50                 # rolling CLV window per sport
  clv_min_bets: 30               # act only with this many CLV observations
  tighten_edge: 0.02             # added to a negative-CLV sport's min edge
  stake_cut: 0.5                 # stake-cap multiplier for a negative-CLV sport

risk:
  daily_loss_limit: 100.0        # stop for the day past this realized loss
  max_daily_new_risk: 0.25       # new stakes per day <= this fraction of bankroll
  max_drawdown: 250.0            # kill switch: stop entirely, require manual reset
  stale_quote_seconds: 120       # skip markets with quotes older than this
  min_minutes_before_start: 10   # don't enter pre-match bets after this cutoff
  max_pre_match_move: 0.08       # refuse entry once the mid has moved this far from
                                 # first sighting: Kalshi's occurrence_datetime is the
                                 # expected END, so the clock alone can pass a live match
  calibration_min_bets: 50       # start monitoring after N settled bets
  calibration_max_brier: 0.26    # pause betting if rolling Brier exceeds this

scan:
  interval_seconds: 300
  sports: [tennis, baseball, table_tennis]

sports:
  tennis:
    enabled: true
    best_of_default: 3
    surface_weight: 0.50        # blend: (1-w)*overall + w*surface (Tennis Abstract optimum)
    min_matches: 10             # skip players with fewer rated matches
  baseball:
    enabled: true
    home_advantage_elo: 24.0
    rest_advantage_elo: 2.3     # per rest-day differential, capped
    sp_enabled: true            # starting-pitcher adjustment
    prob_shrink: 0.8            # shrink probs toward 0.5 (walk-forward tuned)
  table_tennis:
    enabled: true
    best_of_default: 5
    min_edge_override: 0.05     # softer markets but fixing risk: demand more edge
    max_stake_override: 20.0
    min_matches: 8
    prob_shrink: 0.5             # walk-forward tuned; TT model shows no edge yet — see engine docstring

storage:
  sqlite_path: data/sportsbot.sqlite
  ratings_dir: data/ratings

logging:
  level: INFO
  file: logs/sportsbot.log
