[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsbot"
version = "1.0.0"
description = "Consolidated sports prediction engine and exchange trading bot (Polymarket live; Kalshi-ready)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
polymarket = [
    # NOTE: the classic `py-clob-client` is archived and non-functional against
    # CLOB V2 — do not add it. `polymarket-client` is the official unified py-sdk.
    "polymarket-client>=0.9",
]
kalshi = [
    "cryptography>=42.0",
]
mlb = [
    "MLB-StatsAPI>=1.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
all = [
    "sportsbot[polymarket,kalshi,mlb,dev]",
]

[project.scripts]
sportsbot = "sportsbot.cli:app"

[tool.setuptools.packages.find]
include = ["sportsbot*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
