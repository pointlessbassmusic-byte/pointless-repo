name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [polymarket-bot, kalshi-engine, arb-scanner]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # py-clob-client is imported lazily (live trading only) so tests don't need it
      - run: pip install requests python-dotenv PyYAML cryptography pytest
      - run: python -m pytest tests -q
